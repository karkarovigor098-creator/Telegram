name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Обновили до v4

    - name: set up JDK 17
      uses: actions/setup-java@v4 # Обновили до v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4 # КРИТИЧНО: заменили на v4
      with:
        name: telegram-app
        path: TMessagesProj/build/outputs/apk/debug/TMessagesProj-debug.apk 
